name: Build PCGuardian iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PCGuardian.xcodeproj \
            -scheme PCGuardian \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -40

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PCGuardian.app Payload/
          zip -qry PCGuardian-iOS.ipa Payload
          ls -la PCGuardian-iOS.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCGuardian-iOS-ipa
          path: PCGuardian-iOS.ipa
          retention-days: 90
