<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🧸 YOYO 的打卡小天地</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFE3EC">
<style>
/* ============ YOYO 卡通风格 · 儿童端（只读） ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:#4a4453;min-height:100vh;
  background:linear-gradient(180deg,#fff0f4 0%,#fff7ec 30%,#eefaf1 62%,#e6f3ff 100%);
  background-attachment:fixed;overflow-x:hidden;padding-bottom:40px}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.mascot{display:inline-block;vertical-align:middle}

/* 漂浮装饰 */
.deco{position:fixed;z-index:0;pointer-events:none;user-select:none;font-size:2rem;opacity:.8;
  animation:floaty 7s ease-in-out infinite}
.deco.d2{font-size:1.5rem;animation-duration:9s;animation-delay:-3s}
.deco.d3{font-size:1.2rem;animation-duration:6s;animation-delay:-1.5s}
.deco.d4{font-size:2.4rem;animation-duration:11s;animation-delay:-5s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(5deg)}}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:14px 14px 0}

/* ============ 顶栏 ============ */
header{text-align:center;padding:10px 0 4px}
.logo{display:inline-flex;align-items:center;gap:10px;background:#fff;border:3px solid #ffc9d8;border-radius:999px;
  padding:6px 20px 6px 8px;font-size:1.12rem;font-weight:900;box-shadow:0 4px 0 #ffc9d8;color:#d8607f}
.logo .name{color:#2f8fd8;border-bottom:3px dotted #a8d5ff;line-height:1.15}
.logo .mascot{width:46px;height:46px;flex:none}
.sub{margin-top:6px;font-size:.78rem;color:#a29bb0}

/* ============ 金额总计（顶部） ============ */
.total{background:linear-gradient(135deg,#fff6e8,#ffe9f0);border:3px solid #ffcf7a;border-radius:26px;
  box-shadow:0 6px 0 #ffcf7a;padding:14px 16px;margin:14px 0;display:flex;align-items:center;gap:12px}
.total .mascot{width:62px;height:62px;flex:none}
.total .mascot .coin-spin{animation:coinspin 3.2s ease-in-out infinite}
@keyframes coinspin{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
.total .t-info{flex:1}
.total .t-k{font-size:.8rem;color:#c08a3e;font-weight:700}
.total .t-v{font-size:2rem;font-weight:900;color:#e07b00;line-height:1.15}
.total .t-sub{font-size:.72rem;color:#c9a06a;margin-top:2px}
.total .t-sub b{color:#1e8449}.total .t-sub i{font-style:normal;color:#e07b00;font-weight:700}

/* ============ 日期条 ============ */
.datebar{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid #ffd7e3;border-radius:22px;
  box-shadow:0 5px 0 #ffd7e3;padding:10px 12px;margin-bottom:14px}
.datebar button{width:44px;height:44px;border-radius:50%;background:#ffeff4;font-size:1.3rem;font-weight:900;color:#e086a5;
  box-shadow:0 3px 0 #ffd0de;line-height:1}
.datebar button:active{transform:translateY(2px);box-shadow:none}
.date-mid{flex:1;text-align:center}
.date-mid .d1{font-size:1.15rem;font-weight:900}
.date-mid .d2{font-size:.8rem;color:#a29bb0;margin-top:2px}
.today-btn{width:auto!important;border-radius:999px!important;padding:0 14px;font-size:.85rem!important}
.badge{display:inline-block;background:#ffe9a8;color:#9a6b00;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700;vertical-align:2px}

/* ============ 进度卡片 ============ */
.hero{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #b7e6c4;border-radius:26px;
  box-shadow:0 6px 0 #b7e6c4;padding:16px;margin-bottom:14px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .txt b{font-size:1.5rem;color:#1e8449}
.ring .txt span{font-size:.66rem;color:#999}
.hero-info{flex:1}
.hero-info .title{font-size:1rem;font-weight:900;margin-bottom:6px}
.bar{height:16px;background:#f1eef5;border-radius:999px;overflow:hidden;border:2px solid #e6e0ee}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#9ad97e,#34b34a);transition:width .6s ease}
.hero-info .hint{font-size:.8rem;color:#a29bb0;margin-top:8px}
.coin{text-align:center;flex:none}
.coin .mascot{width:64px;height:64px;animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.coin b{display:block;font-size:1.15rem;color:#1e8449}
.coin span{font-size:.68rem;color:#8fbf9c}

/* ============ 任务列表 ============ */
.sect{margin-bottom:16px}
.sect-head{display:flex;align-items:center;gap:8px;font-size:1.02rem;font-weight:900;padding:2px 6px}
.sect-head .cnt{margin-left:auto;background:#fff;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;
  box-shadow:0 2px 0 rgba(0,0,0,.06)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;
  border:3px solid #dfeff7;box-shadow:0 4px 0 #dfeff7;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .face{font-size:1.7rem;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:#f2fbff;border-radius:50%}
.card .nm{flex:1;font-size:.95rem;font-weight:700;line-height:1.3}
.card .nm small{display:block;font-weight:400;font-size:.7rem;color:#b3adbd;margin-top:2px}
.card .amt{flex:none;font-weight:900;font-size:.95rem}
/* 已完成 */
.sect.done .card{border-color:#bdebcb;box-shadow:0 4px 0 #bdebcb;background:#f6fff3}
.sect.done .card .amt{color:#1e8449}
.sect.done .face{background:#e3f8dc;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* 未完成 */
.sect.todo .card{border-color:#ffd9b8;box-shadow:0 4px 0 #ffd9b8;background:#fffaf2}
.sect.todo .card .amt{color:#d99a26;font-size:.8rem;font-weight:700}
.sect.todo .face{background:#fff0dd;filter:grayscale(.15)}
.sect-head .tag{font-size:1.2rem}
.empty{background:#fff;border:3px dashed #e3dceb;border-radius:20px;padding:18px 14px;text-align:center;color:#a29bb0;font-size:.88rem}
.empty .mascot{width:84px;height:84px;display:block;margin:0 auto 4px}

/* 周末任务小标 */
.wechip{display:inline-block;background:#ffe1e6;color:#d05a6e;border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:700;margin-left:6px;vertical-align:2px}

/* ============ 底部 ============ */
.foot{margin-top:18px;text-align:center}
.readonly-note{display:inline-block;background:#f3ecff;border:2px dashed #cdb6f0;color:#8a63c9;border-radius:16px;
  padding:10px 18px;font-size:.82rem;line-height:1.6}
.sync{margin-top:10px;font-size:.72rem;color:#a5b8cc}
.sync button{font-size:.72rem;color:#2f8fd8;text-decoration:underline;padding:0 2px}
footer.credit{margin-top:14px;font-size:.68rem;color:#d0a9b8}

/* 庆祝横幅 */
.cheer{display:none;background:linear-gradient(135deg,#fff6d8,#ffe7ec);border:3px solid #ffd166;border-radius:22px;
  box-shadow:0 5px 0 #ffd166;padding:14px;text-align:center;margin-bottom:14px;font-weight:900;color:#b06f13;font-size:1.05rem}
.cheer.show{display:block}
.cheer .mascot{width:76px;height:76px;vertical-align:middle}
.cheer .faces{font-size:1.4rem;letter-spacing:6px;vertical-align:middle}

@media (max-width:420px){
  html{font-size:15px}
  .total .mascot{width:52px;height:52px}
  .total .t-v{font-size:1.6rem}
}

/* yoyo 图片容器 */
.yoyo{position:relative;display:inline-flex;width:100%;height:100%;align-items:center;justify-content:center}
.yoyo img{width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 3px 4px rgba(120,90,110,.18))}
.yy-coin{position:absolute;right:-4%;bottom:6%;font-size:1.1em;animation:coinspin 3s ease-in-out infinite}
.yy-check{position:absolute;right:-2%;top:8%;font-size:1em}
@keyframes coinspin{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes yy-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes yy-wink{0%,100%{transform:scale(1)}50%{transform:scale(1.06,0.96)}}
@keyframes yy-jump{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.96,1.06)}55%{transform:translateY(0) scale(1.06,.94)}70%{transform:translateY(-6px) scale(1)}85%{transform:translateY(0) scale(1.03,.97)}}
@keyframes yy-sleep{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.03)}}
@keyframes yy-wave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.yy-bob img{animation:yy-bob 2.6s ease-in-out infinite}
.yy-wink img{animation:yy-wink 3.2s ease-in-out infinite}
.yy-jump img{animation:yy-jump 1.7s ease-in-out infinite}
.yy-sleep img{animation:yy-sleep 4s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(120,90,110,.18)) saturate(.7) brightness(1.03)}
.yy-wave img{animation:yy-wave 2.4s ease-in-out infinite;transform-origin:bottom center}
/* 漂浮装饰改用 mini YOYO 图片 */
.deco.yoyo-deco{font-size:0;width:40px;height:44px;opacity:.7}
.deco.yoyo-deco img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}
/* 背景改为更明亮的 YOYO 马卡龙色 */
</style>

/* mood -> 图片 + 动画类；表情切换 = 切图 + CSS transform 动画（照片静态，动画赋予活力） */
function yoyo(mood, opt){
  opt = opt || {};
  const map = {
    happy:  {img:YOYO_IMG.total, cls:"yy-bob"},
    wink:   {img:YOYO_IMG.logo,  cls:"yy-wink"},
    cheer:  {img:YOYO_IMG.cheer, cls:"yy-jump"},
    sleep:  {img:YOYO_IMG.idle,  cls:"yy-sleep"},
    wave:   {img:YOYO_IMG.coin,  cls:"yy-wave"},
  };
  const it = map[mood] || map.happy;
  let extra = "";
  if(opt.coin)  extra += '<span class="yy-coin">🪙</span>';
  if(opt.check) extra += '<span class="yy-check">✅</span>';
  return '<span class="yoyo '+it.cls+'">'
       + '<img src="'+it.img+'" alt="YOYO">'
       + extra + '</span>';
}

/* ---------- 工具 ---------- */
const WEEK_CN = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function pad(n){return n<10?"0"+n:""+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function isWeekend(d){const w=d.getDay();return w===0||w===6}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function money(x){const r=Math.round(x*100)/100;return "¥"+(Number.isInteger(r)?r:r.toFixed(r*10%10?2:1))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- 数据源读取（只读） ---------- */
const LS_DATA  = "chore-app-data";    // 父页面的本机数据（同源共享 → 即时一致）
const LS_CACHE = "chore-child-cache"; // 云端拉到的数据在本页的只读缓存
const LS_SYNC  = "chore-sync-cfg";    // 云同步配置（与父页面共用同一份）
const SYNC_DEFAULT = { gistId:"b96c91c9966987c90871a9dfb59520d9", file:"chore-data.json" };

function readJson(key){ try{ const o=JSON.parse(localStorage.getItem(key)||"null"); return (o && o.version===1)?o:null; }catch(e){ return null; } }
function tsOf(s){ return s && s.updatedAt ? (Date.parse(s.updatedAt)||0) : 0; }

/* 并集合并（records 逐日逐任务、expenses 按日取较新侧）—— 与父页面 mergeStates 同规则 */
function mergeTwo(a,ua,b,ub){
  const older = ua>=ub ? b : a, newer = ua>=ub ? a : b;
  const nu = Math.max(ua,ub);
  const out = Object.assign({}, newer, {records:{}, expenses:{}});
  // 确保 config 正确合并，优先取较新一侧的 tasks，若无则取较旧一侧
  out.config = Object.assign({}, older?.config||{}, newer?.config||{});
  if(newer?.config?.tasks && newer.config.tasks.length){
    out.config.tasks = newer.config.tasks;
  } else if(older?.config?.tasks && older.config.tasks.length){
    out.config.tasks = older.config.tasks;
  }
  const recs = {};
  const allDates = new Set([...Object.keys(older?.records||{}), ...Object.keys(newer?.records||{})]);
  for(const dk of allDates){
    const o=(older?.records||{})[dk]||{}, n=(newer?.records||{})[dk]||{};
    const day={};
    for(const tid of new Set([...Object.keys(o),...Object.keys(n)])){
      if(n[tid]&&n[tid].done) day[tid]=n[tid];                    // 较新侧已打卡 → 保留
      else if(o[tid]&&o[tid].done && !(tid in n)) day[tid]=o[tid]; // 较新侧完全没这条 → 保留旧数据
    }
    if(Object.keys(day).length) recs[dk]=day;
  }
  out.records=recs;
  out.expenses=Object.assign({}, older?.expenses||{}, newer?.expenses||{});
  out.updatedAt = newer?.updatedAt || (nu?new Date(nu).toISOString():null);
  return out;
}
function currentTasks(){
  if(state && state.config && Array.isArray(state.config.tasks) && state.config.tasks.length){
    return state.config.tasks;
  }
  const local = readJson(LS_DATA);
  if(local && local.config && Array.isArray(local.config.tasks) && local.config.tasks.length){
    return local.config.tasks;
  }
  const cache = readJson(LS_CACHE);
  if(cache && cache.config && Array.isArray(cache.config.tasks) && cache.config.tasks.length){
    return cache.config.tasks;
  }
  return DEFAULT_TASKS;
}
let state = collectState();
function collectState(){
  const local = readJson(LS_DATA), cache = readJson(LS_CACHE);
  if(local && cache) return mergeTwo(local,tsOf(local),cache,tsOf(cache));
  return local || cache || {version:1, childName:"孩子", records:{}, expenses:{}};
}

/* 金额总计（口径与父页面一致：结余 = 全部已记录收入 − 全部已记录支出） */
function allIncome(){ let s=0; for(const dk in (state.records||{})) { const r=state.records[dk]; for(const tid in r){ const v=r[tid]; if(v&&v.done) s+=v.amount||0; } } return Math.round(s*100)/100; }
function allExpense(){ let s=0; for(const dk in (state.expenses||{})){ const l=state.expenses[dk]; if(Array.isArray(l)) for(const e of l) s+=e.amount||0; } return Math.round(s*100)/100; }

/* ---------- 云端只读拉取（有 token 才启用；绝不推送） ---------- */
function syncCfg(){
  let o={}; try{ o=JSON.parse(localStorage.getItem(LS_SYNC)||"{}"); }catch(e){}
  const token = (o.token!=null && o.token!=="") ? o.token : "";
  return { gistId:o.gistId||SYNC_DEFAULT.gistId, token, apiBase:o.apiBase||"https://api.github.com", disabled:!!o.disabled };
}
async function pullCloud(){
  const c = syncCfg();
  const setLine=(t)=>{ const el=document.getElementById("syncLine"); if(el) el.innerHTML=t; };
  if(!c.gistId || !c.token || c.disabled){ setLine("📱 本机数据（未配置云端，若与爸爸妈妈共用手机可直接看到最新）· <button id=\"btnCfg\">☁️ 配置云端</button>"); bindCfg(); return; }
  setLine("☁️ 同步中…");
  try{
    const r = await fetch(`${c.apiBase}/gists/${c.gistId}`,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const f = j.files && j.files[SYNC_DEFAULT.file];
    if(!f) throw new Error("云端缺少数据文件");
    const remote = JSON.parse(f.content);
    remote.updatedAt = remote.updatedAt || j.updated_at || null;
    const prev = readJson(LS_CACHE);
    const merged = prev ? mergeTwo(remote,tsOf(remote),prev,tsOf(prev)) : remote;
    localStorage.setItem(LS_CACHE, JSON.stringify(merged));   // 只写本页自己的缓存 key
    state = collectState();
    render();
    setLine("☁️ 已同步云端 · "+fmtT(new Date().toISOString())+" <button id=\"btnSync\">刷新</button>");
    bindSync();
  }catch(e){
    setLine((e.message.includes("401")||e.message.includes("403")||e.message.includes("404")?"☁️ 云端连接失败（token 可能过期）":"☁️ 云端连不上，展示本机数据")+" · <button id=\"btnSync\">重试</button>");
    bindSync();
  }
}
function fmtT(iso){ if(!iso)return"—"; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function bindSync(){ const b=document.getElementById("btnSync"); if(b)b.onclick=pullCloud; }
function bindCfg(){ const b=document.getElementById("btnCfg"); if(b)b.onclick=openCfg; }
function openCfg(){
  const v = prompt("粘贴爸爸妈妈给的配置 token（github_pat_ 开头，仅存本机）：","");
  if(v && /^(github_pat_|gh[pousr])/.test(v.trim())){
    let o={}; try{o=JSON.parse(localStorage.getItem(LS_SYNC)||"{}")}catch(e){}
    localStorage.setItem(LS_SYNC, JSON.stringify({...o, token:v.trim(), disabled:false}));
    pullCloud();
  }
}
/* URL 片段携带 token（与父页面配置链接格式一致：#token=...）*/
(function hashBootstrap(){
  const h=decodeURIComponent(location.hash||""), m=h.match(/token=([A-Za-z0-9_\-\.]+)/);
  if(m && /^(github_pat_|gh[pousr])/.test(m[1])){
    let o={}; try{o=JSON.parse(localStorage.getItem(LS_SYNC)||"{}")}catch(e){}
    localStorage.setItem(LS_SYNC, JSON.stringify({...o, token:m[1], disabled:false}));
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  }
})();

/* ---------- 视图状态 ---------- */
let cursor = new Date(); cursor.setHours(0,0,0,0);
document.getElementById("mLogo").innerHTML  = yoyo("wink");
document.getElementById("mTotal").innerHTML = yoyo("happy",{coin:true});
document.getElementById("mCheer").innerHTML = yoyo("cheer");
document.getElementById("mCoin").innerHTML  = yoyo("happy");

/* ---------- 渲染 ---------- */
function render(){
  document.getElementById("childName").textContent = state.childName || "孩子";
  const today = new Date(); today.setHours(0,0,0,0);
  const dk = dkey(cursor);
  const we = isWeekend(cursor);
  const isToday = dkey(cursor)===dkey(today);
  const isFuture = cursor > today;

  /* 金额总计（顶部） */
  const inc = allIncome(), exp = allExpense(), bal = Math.round((inc-exp)*100)/100;
  document.getElementById("totalBalance").textContent = money(bal);
  document.getElementById("totalIncome").textContent  = money(inc);
  document.getElementById("totalExpense").textContent = money(exp);

  document.getElementById("dLabel").textContent =
    `${cursor.getFullYear()}年${cursor.getMonth()+1}月${cursor.getDate()}日 · ${WEEK_CN[cursor.getDay()]}${we?" 🎈":""}`;
  document.getElementById("dSub").innerHTML = isToday ? `<span class="badge">今天</span>`
    : isFuture ? "🚀 这天还没到哦" : "📖 过去的记录";

  const rec = (state.records||{})[dk] || {};
  const tasks = currentTasks();
  const doneList=[], todoList=[];
  let dayInc=0;
  for(const t of tasks){
    if(t.weekendOnly && !we) continue;          // 仅周末任务：非周末不出现（与父页面计数口径一致）
    const on = rec[t.id] && rec[t.id].done;
    if(on){ doneList.push({t, amt:rec[t.id].amount||t.amount}); dayInc += rec[t.id].amount||t.amount; }
    else todoList.push(t);
  }
  const total = doneList.length + todoList.length;
  dayInc = Math.round(dayInc*100)/100;

  /* 进度 */
  const pct = total? doneList.length/total : 0;
  const C=2*Math.PI*38;
  const arc=document.getElementById("ringArc");
  arc.setAttribute("stroke-dashoffset", (C*(1-pct)).toFixed(1));
  arc.setAttribute("stroke", pct>=1?"#34b34a":"#7ed957");
  document.getElementById("ringNum").textContent = `${doneList.length}/${total}`;
  document.getElementById("heroBar").style.width = Math.round(pct*100)+"%";
  document.getElementById("heroTitle").textContent = isFuture ? "敬请期待" : isToday ? "今日进度" : "当天进度";
  const hints = isFuture ? "🔮 到了这天，任务会自己跳出来！"
    : pct>=1 && total>0 ? "🏆 全部完成！今天的你已经超级棒了！"
    : pct>=0.6 ? "💪 已经完成一大半啦，冲呀！"
    : doneList.length>0 ? "🌟 开了个好头，继续加油！"
    : "☀️ 新的一天，从第一个小任务开始吧！";
  document.getElementById("heroHint").textContent = hints;
  document.getElementById("daySum").textContent = isFuture ? "—" : money(dayInc);
  document.getElementById("cheer").className = "cheer" + ((pct>=1&&total>0)? " show":"");
  document.getElementById("mCoin").innerHTML = yoyo(pct>=1&&total>0&&!isFuture ? "cheer" : "happy");

  /* 列表 */
  document.getElementById("cntDone").textContent = doneList.length+" 项";
  document.getElementById("cntTodo").textContent = todoList.length+" 项";
  document.getElementById("listDone").innerHTML = doneList.length
    ? doneList.map(({t,amt})=>`<div class="card">
        <span class="face">${GROUP_FACE[t.group]||"⭐"}</span>
        <span class="nm">${escapeHtml(t.name)}${t.weekendOnly?'<span class="wechip">仅周末</span>':''}<small>${t.group}</small></span>
        <span class="amt">✓ ${money(amt)}</span></div>`).join("")
    : `<div class="empty"><span class="mascot">${yoyo(isFuture?"sleep":"wink")}</span><div>${isFuture?"这天还没到，还没有任务哦":"还没有完成的任务，快去叫爸爸妈妈打卡吧！"}</div></div>`;
  document.getElementById("listTodo").innerHTML = todoList.length
    ? todoList.map(t=>`<div class="card">
        <span class="face">${GROUP_FACE[t.group]||"⭐"}</span>
        <span class="nm">${escapeHtml(t.name)}${t.weekendOnly?'<span class="wechip">仅周末</span>':''}<small>${t.group}</small></span>
        <span class="amt">${isFuture?"":t.amountText}</span></div>`).join("")
    : `<div class="empty"><span class="mascot">${yoyo("cheer")}</span><div>今天的任务全部完成，没有剩余啦！</div></div>`;
}

/* ---------- 交互（仅翻日期，不可修改任何数据） ---------- */
document.getElementById("navPrev").addEventListener("click",()=>{cursor=addDays(cursor,-1);render()});
document.getElementById("navNext").addEventListener("click",()=>{cursor=addDays(cursor,1);render()});
document.getElementById("navToday").addEventListener("click",()=>{cursor=new Date();cursor.setHours(0,0,0,0);render()});

/* ---------- 实时刷新：同设备即时一致 + 定时轮询云端 ---------- */
window.addEventListener("storage",e=>{        // 父页面在同一浏览器改动 → 瞬间刷新
  if(e.key===LS_DATA || e.key===LS_CACHE){ state=collectState(); render(); }
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pullCloud(); });
render();
pullCloud();
setInterval(pullCloud, 30000);
</script>
