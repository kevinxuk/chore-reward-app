<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌟 家务零花钱打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF9E6">
<style>
:root{
  --c-morning:#FFF9E6; --c-chore:#E8F4FD; --c-study:#E8F8F5; --c-sport:#E8F8E8;
  --c-weekend:#FFE8E8; --ink:#333; --ink2:#666; --red:#c0392b; --green:#1e8449;
  --line:#ddd; --card:#fff; --bg:#F6F4EF; --accent:#F5A623; --blue:#2478b8;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:70px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}

/* ===== 顶栏 ===== */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hd-top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.hd-title{font-size:1.05rem;font-weight:700}
.hd-title .child{color:var(--blue);cursor:pointer;border-bottom:1px dashed var(--blue)}
.hd-bal{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem;white-space:nowrap}
.hd-bal .game-sum{color:var(--green);font-weight:600}
.total-chip{background:linear-gradient(135deg,#fff4e0,#ffe9cf);border:1.5px solid #f3d9b5;border-radius:10px;padding:4px 12px;text-align:right;line-height:1.25}
.total-chip .tc-k{font-size:.68rem;color:#a06a1a;font-weight:600}
.total-chip .tc-v{font-size:1.25rem;font-weight:800;color:var(--red)}
.total-chip .tc-sub{font-size:.62rem;color:#b98a4d}
.hd-nav{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
.views{display:flex;background:#eee;border-radius:8px;padding:2px;gap:2px}
.views button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:.85rem;color:var(--ink2)}
.views button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.range{display:flex;align-items:center;gap:4px;margin-left:auto}
.range button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-size:.9rem;line-height:1}
.range .lbl{min-width:110px;text-align:center;font-weight:700;font-size:.9rem}
.range .today-btn{width:auto;padding:0 10px;font-size:.78rem;color:var(--blue)}
.hd-tools{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.hd-tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:.75rem;color:var(--ink2)}
.hd-tools button:hover{border-color:var(--blue);color:var(--blue)}

main{max-width:1200px;margin:0 auto;padding:12px}

/* ===== 结算条 ===== */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum-card{flex:1;min-width:110px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px}
.sum-card .k{font-size:.75rem;color:var(--ink2)}
.sum-card .v{font-size:1.3rem;font-weight:800;margin-top:2px}
.sum-card.income .v{color:var(--green)} .sum-card.expense .v{color:var(--accent)} .sum-card.balance .v{color:var(--red)}

/* ===== 日视图 ===== */
.day-head{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:12px}
.day-head .d-info{flex:1}
.day-head .d-date{font-size:1.1rem;font-weight:800}
.day-head .d-sub{font-size:.78rem;color:var(--ink2);margin-top:2px}
.progress-ring{position:relative;width:56px;height:56px;flex:none}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.day-income{flex:none;text-align:right;font-size:.8rem;color:var(--ink2)}
.day-income b{display:block;font-size:1.35rem;color:var(--green)}
.grp{margin-bottom:14px}
.grp-title{font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px}
.grp-title .gt-sum{margin-left:auto;font-weight:600;font-size:.75rem;color:var(--ink2)}
.grp-morning .grp-title{background:var(--c-morning)} .grp-chore .grp-title{background:var(--c-chore)}
.grp-study .grp-title{background:var(--c-study)} .grp-sport .grp-title{background:var(--c-sport)}
.task-list{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;user-select:none}
.task:last-child{border-bottom:0}
.task .ck{width:26px;height:26px;flex:none;border:2px solid #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:all .15s;background:#fff}
.task.done .ck{background:var(--green);border-color:var(--green)}
.task .nm{flex:1;font-size:.92rem}
.task.done .nm{color:var(--ink2);text-decoration:line-through}
.task .amt{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.task.done .amt{color:var(--green);font-weight:700}
.task.off{opacity:.45;cursor:not-allowed}
.task.off .ck{border-style:dashed}

/* ===== 兑换/消费卡片 ===== */
.spend-card{background:linear-gradient(135deg,#fff7ec,#ffefe0);border:1.5px solid #f3d9b5;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.spend-card h3{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.spend-card h3 .bal-hint{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--ink2)}
.game-hours{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.custom-game{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:.8rem}
.custom-game input{width:70px;border:1px solid #e0b97c;border-radius:8px;padding:6px;font-size:.85rem;text-align:center}
.spend-actions{display:flex;gap:8px;flex-wrap:wrap}
.spend-actions button{border:0;border-radius:10px;padding:9px 16px;font-size:.85rem;font-weight:700}
.btn-redeem{background:var(--accent);color:#fff} .btn-redeem:disabled{background:#e5d5bd;color:#fff;cursor:not-allowed}
.btn-add-exp{background:#fff;border:1.5px solid #e0b97c;color:#a06a1a}
.day-expenses{margin-top:10px;border-top:1px dashed #e0b97c;padding-top:8px}
.exp-item{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:.85rem}
.exp-item .ex-nm{flex:1}
.exp-item .ex-amt{color:var(--accent);font-weight:700}
.exp-item .ex-del{border:0;background:transparent;color:#c9a06a;font-size:.95rem;padding:2px 6px}
.midweek-note{background:#eef4fb;border:1px solid #d5e5f5;border-radius:var(--radius);padding:10px 14px;font-size:.8rem;color:var(--ink2);margin-bottom:14px}

/* ===== 周/月表格 ===== */
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:max-content;min-width:100%;font-size:.8rem}
.grid th,.grid td{border:1px solid #eee;padding:0;text-align:center;white-space:nowrap}
.grid thead th{background:#f8f8f8;font-weight:600;color:#444;position:sticky;top:0;z-index:2}
.grid thead th.we{background:var(--c-weekend);color:var(--red)}
.grid .rowhead{position:sticky;left:0;z-index:1;background:inherit;text-align:left;padding:4px 8px;min-width:150px;max-width:220px;font-size:.75rem;border-right:2px solid #ddd}
.grid tr.grp-row td{background:#f0f0f0;font-weight:700;text-align:left;padding:4px 10px;color:#1a5276}
.grid td.cell{width:34px;height:30px;cursor:pointer;position:relative}
.grid td.cell.we{background:#FFF6F6}
.grid td.cell.off{background:#f5f5f5;color:#ccc;cursor:not-allowed}
.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.cell .tick{color:var(--green);font-weight:800}
.grid td.cell.weekendtask.on{background:#d9f2e3}
.grid tr.we-row td.we{background:#FFF1F1}
.grid .sumrow td,.grid .sumcol{font-weight:800;background:#fffdf2;color:var(--red)}
.grid .total-col{width:52px;font-weight:700;color:var(--red);background:#fffdf2}
.grid .amt-col{width:48px;font-size:.68rem;color:#888;background:inherit}
.exp-row-label{font-size:.68rem;color:var(--ink2);line-height:1.1}
.weekend-cell{cursor:pointer}
.weekend-cell .exp-badge{position:absolute;top:1px;right:1px;font-size:.6rem;color:var(--accent)}

/* ===== 年视图 ===== */
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.m-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;transition:transform .1s}
.m-card:hover{transform:translateY(-2px)}
.m-card.cur{outline:2px solid var(--accent)}
.m-card .m-title{font-weight:800;font-size:.95rem;margin-bottom:8px}
.m-card .m-line{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);padding:2px 0}
.m-card .m-line b{color:var(--ink)}
.m-card .m-inc b{color:var(--green)} .m-card .m-exp b{color:var(--accent)}
.m-bar{height:6px;background:#eee;border-radius:3px;margin-top:8px;overflow:hidden}
.m-bar i{display:block;height:100%;background:var(--green);border-radius:3px}

/* ===== 弹层 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{font-size:1rem;margin-bottom:12px}
.modal label{display:block;font-size:.78rem;color:var(--ink2);margin:8px 0 4px}
.modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:.95rem}
.modal .m-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal .m-actions button{border:0;border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:600}
.m-cancel{background:#eee;color:var(--ink)} .m-ok{background:var(--blue);color:#fff}
.chip-row{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;border:1.5px solid #e0b97c;background:#fff;border-radius:9px;padding:7px 0;font-size:.88rem;font-weight:700;color:#a06a1a}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.m-err{color:var(--red);font-size:.75rem;margin-top:6px;min-height:1em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:200;max-width:88vw;text-align:center;transition:opacity .3s}
.file-badge{display:inline-flex;align-items:center;gap:4px;background:#e8f8ee;color:var(--green);border-radius:8px;padding:3px 8px;font-size:.7rem;font-weight:600}
.cloud-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:.95rem;padding:0;flex:none}
.cloud-btn.st-dirty{border-color:#f5c542;background:#fff8e6}
.cloud-btn.st-busy{border-color:#9ec9ee;background:#eef6fd;animation:cpulse 1s infinite}
.cloud-btn.st-error,.cloud-btn.st-auth{border-color:#e08585;background:#fdf0f0}
@keyframes cpulse{50%{opacity:.45}}

/* ===== 任务管理抽屉 ===== */
.td-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .25s ease}
.td-mask.show{opacity:1;pointer-events:auto}
.td-drawer{width:100%;max-width:540px;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.td-mask.show .td-drawer{transform:translateX(0)}
.td-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fcfcfc}
.td-header h2{font-size:1.05rem;font-weight:800;color:var(--ink);flex:1;display:flex;align-items:center;gap:6px}
.td-btn-add{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:4px}
.td-btn-reset{background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem}
.td-btn-reset:hover{color:var(--red);border-color:var(--red)}
.td-btn-close{border:0;background:transparent;font-size:1.3rem;color:var(--ink2);padding:0 6px;line-height:1}
.td-body{flex:1;overflow-y:auto;padding:12px 16px;background:var(--bg)}
.td-grp-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid #eee}
.td-grp-hd{padding:9px 12px;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.td-grp-card.grp-morning .td-grp-hd{background:var(--c-morning)}
.td-grp-card.grp-chore .td-grp-hd{background:var(--c-chore)}
.td-grp-card.grp-study .td-grp-hd{background:var(--c-study)}
.td-grp-card.grp-sport .td-grp-hd{background:var(--c-sport)}
.td-task-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #f2f2f2;background:#fff;transition:background .1s}
.td-task-row:hover{background:#fafafa}
.td-task-main{flex:1;min-width:0}
.td-task-title{font-size:.9rem;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.td-we-badge{font-size:.65rem;color:var(--red);background:#ffebee;padding:1px 6px;border-radius:4px;font-weight:normal}
.td-task-sub{font-size:.75rem;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:8px}
.td-amt-tag{color:var(--green);font-weight:700;font-size:.82rem}
.td-amt-text{color:#999;font-size:.72rem}
.td-task-ops{display:flex;gap:4px;flex-shrink:0}
.td-task-ops button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:.75rem;color:var(--ink2)}
.td-task-ops button:hover{background:#f5f5f5}
.td-task-ops .btn-edit:hover{border-color:var(--blue);color:var(--blue)}
.td-task-ops .btn-del:hover{border-color:var(--red);color:var(--red)}

/* 抽屉内编辑子模态/表单 */
.td-form-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:130;display:flex;align-items:center;justify-content:center;padding:16px}
.td-form-card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.22);max-height:92vh;overflow-y:auto}
.td-form-card h3{font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.td-form-field{margin-bottom:12px}
.td-form-field label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:5px}
.td-form-field input[type="text"],.td-form-field input[type="number"],.td-form-field select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem;outline:none}
.td-form-field input:focus,.td-form-field select:focus{border-color:var(--blue)}
.td-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.td-chip{border:1px solid #dcdcdc;background:#f9f9f9;border-radius:6px;padding:4px 10px;font-size:.78rem;font-weight:600;color:#555}
.td-chip:hover{border-color:var(--blue);color:var(--blue)}
.td-chip.on{background:#e8f4fd;border-color:var(--blue);color:var(--blue)}
.td-checkbox-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.85rem;color:var(--ink)}
.td-checkbox-row input{width:16px;height:16px;cursor:pointer}
.td-form-err{color:var(--red);font-size:.75rem;min-height:1.2em;margin-top:6px}
.td-form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.td-form-actions button{border:0;border-radius:8px;padding:9px 18px;font-size:.88rem;font-weight:600}

footer{max-width:1200px;margin:0 auto;padding:6px 16px 20px;font-size:.7rem;color:#aaa;text-align:center}

/* ===== 响应式 ===== */
@media (max-width:1023px){ /* 平板竖屏/手机 */
  .range .lbl{min-width:88px}
  .sum-card{min-width:90px;padding:8px 10px}
  .sum-card .v{font-size:1.1rem}
}
@media (max-width:699px){ /* 手机 */
  html{font-size:14.5px}
  .hd-tools button{padding:4px 8px}
  table.grid{font-size:.72rem}
  .grid .rowhead{min-width:110px;max-width:150px;font-size:.68rem}
  .grid td.cell{width:28px;height:27px}
}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <span class="hd-title">🌟 家务零花钱 · <span class="child" id="childName" title="点击修改昵称">孩子</span>
      <button id="btnChild" title="打开孩子的只读观看页" style="border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-size:.95rem;padding:0;vertical-align:middle;margin-left:6px;cursor:pointer">🧒</button></span>
    <span class="hd-bal">
      <span id="fileBadge" style="display:none" class="file-badge">📁 <span id="fileName"></span> <button id="unbindFile" style="border:0;background:transparent;color:inherit;cursor:pointer;text-decoration:underline;padding:0">解除</button></span>
      <span class="game-sum" id="hdGame"></span>
      <button id="cloudBtn" class="cloud-btn st-off" title="云同步：单击立即同步，双击设置">☁️</button>
      <span class="total-chip" title="孩子每日积累零花钱总数，消费自动减扣">
        <div class="tc-k">💰 总计</div>
        <div class="tc-v" id="hdBalance">¥0</div>
        <div class="tc-sub"><span id="hdIncSum">累计收入 ¥0</span> · <span id="hdExpSum">已消费 ¥0</span></div>
      </span>
    </span>
  </div>
  <div class="hd-nav">
    <div class="views" id="viewTabs">
      <button data-v="day">日</button><button data-v="week">周</button><button data-v="month">月</button><button data-v="year">年</button>
    </div>
    <div class="range">
      <button id="navPrev">‹</button>
      <span class="lbl" id="navLabel">—</span>
      <button id="navNext">›</button>
      <button class="range today-btn" id="navToday">今天</button>
    </div>
  </div>
  <div class="hd-tools">
    <button id="btnTaskManage" title="配置任务列表与奖励金额" style="border-color:#2478b8;color:#2478b8;font-weight:600">⚙️ 任务管理</button>
    <button id="btnDispatch" title="分派电脑任务与奖励时长（含 AI 评分、零花钱兑换、临时解锁）" style="border-color:#6a4fb0;color:#6a4fb0;font-weight:600">🖥️ 电脑任务</button>
    <button id="btnAI" title="配置 AI 评分接口（OpenAI 兼容，密钥存独立 Gist）" style="border-color:#0d9488;color:#0d9488;font-weight:600">🤖 AI设置</button>
    <button id="btnExport" title="导出 JSON 备份">📤</button>
    <button id="btnImport" title="导入 JSON 备份">📥</button>
    <button id="btnBind" style="display:none">🔗 绑定数据文件</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</header>

<main id="main"></main>

<footer>数据保存在本机浏览器 · 可导出 JSON 备份/换机迁移 · 周末可添加自定义消费记录；游戏时长兑换已整合进「🖥️ 电脑任务」（¥<span id="ftRate">5</span>/小时）</footer>

<script>
"use strict";
/* ================= 默认任务配置（源自 2026年9月 v2 打卡表） ================= */
const DEFAULT_TASKS = [

function normalizeConfig(s){

async function gistFetch(){
  const c = syncCfg();
  let last;
  for(let i=0;i<3;i++){
    try{
      const r = await fetch(`${c.apiBase}/gists/${c.gistId}`, {headers:{Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json"}});
      if(!r.ok){ const e = new Error("HTTP "+r.status); e.status=r.status; throw e; }
      const j = await r.json();
      cloudMeta = { sha: j.id + ":" + (j.updated_at||""), updatedAt: j.updated_at };
      const f = j.files && j.files[SYNC.file];
      if(!f) throw new Error("云端缺少数据文件");
      return { state: JSON.parse(f.content), remoteU: j.updated_at };
    }catch(e){
      if(e.status===401 || e.status===403 || e.status===404) throw e; // 鉴权/不存在不重试
      last = e; if(i<2) await new Promise(r=>setTimeout(r, 1000*(i+1)));
    }
  }
  throw last;

    headers:{Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
    body: JSON.stringify(body)});
  if(!r.ok){ const e=new Error("HTTP "+r.status); e.status=r.status; throw e; }

function applyCloud(remote){

  const base = defaultState();
  base.childName = remote.childName || base.childName;
  if(remote.config && remote.config.gameRate>0) base.config.gameRate = remote.config.gameRate;
  if(remote.config && Array.isArray(remote.config.tasks) && remote.config.tasks.length){
    base.config.tasks = remote.config.tasks;

  // 电脑时长 / 任务分派 / AI 配置：云端有则用云端，云端缺段则保留本机（老数据兼容）
  if(remote.config && remote.config.computer) base.config.computer = remote.config.computer;
  if(remote.config && remote.config.dispatch && Array.isArray(remote.config.dispatch.tasks)){
    base.config.dispatch = remote.config.dispatch;

function schedulePush(){

function doPush(){
  if(syncing || !syncActive()) return;
  syncing = true; syncStatus("busy");
  (async()=>{
    try{
      let remote=null, remoteU="";
      try{ const g = await gistFetch(); remote=g.state; remoteU=g.remoteU; }
      catch(e){ if(e.status===401||e.status===403||e.status===404) throw e; /* 网络错误：尝试直接推送 */ }
      // 云端比基线新且本地也有改动 → 自动静默合并后再推（保两端数据都不丢）
      if(remote && remoteU > (state.lastSyncAt||"") && (state.updatedAt||"") > (state.lastSyncAt||"")){
        const merged = mergeStates({state:remote, u:remoteU}, {state, u:state.updatedAt||""});
        applyState(merged); saveStateOnly(); render();
      }
      await gistPush(state);
      markSynced(state.updatedAt);
      syncStatus("idle");
    }catch(e){
      if(e.status===401||e.status===403){ syncStatus("auth"); toast("云同步 token 无效或已过期，点 ☁️ 重新设置"); }
      else { syncStatus("error"); toast("云同步失败（本地数据不受影响），稍后自动重试"); pendingRetry=setTimeout(doPush, 8000); }
    }finally{ syncing=false; }
  })();
}
/* 启动时同步：云端新→拉取；本地新→推送；双方新→确认合并 */
async function bootSync(){
  if(!syncActive()){ syncStatus("off"); return; }
  syncing = true; syncStatus("busy");
  try{
    const {state:remote, remoteU} = await gistFetch();
    const base = state.lastSyncAt || "";
    const localChanged = (state.updatedAt||"") > base;
    const remoteChanged = remoteU > base;
    if(remoteChanged && !localChanged){ applyCloud(remote); markSynced(remoteU); syncStatus("idle"); }
    else if(localChanged && !remoteChanged){ await gistPush(state); markSynced(state.updatedAt); syncStatus("idle"); }
    else if(localChanged && remoteChanged){ askMerge(remote, remoteU); }
    else { markSynced(remoteU); syncStatus("idle"); }
  }catch(e){
    if(e.status===401||e.status===403) syncStatus("auth");
    else syncStatus("error");
  }finally{ syncing=false; }
}
/* 合并：records 逐日期逐任务并集（任务在较新一侧被显式取消则删除）；expenses 取较新一侧 */
function mergeStates(a, b){ // a/b = {state, u} 各带较新时间；返回值以较新侧为主体
  const older = a.u>=b.u ? b : a, newer = a.u>=b.u ? a : b;
  const out = Object.assign({}, newer.state, {records:{}, expenses:{}});
  const recs = {};
  const allDates = new Set([...Object.keys(older.state.records||{}), ...Object.keys(newer.state.records||{})]);
  for(const dk of allDates){
    const o = (older.state.records||{})[dk]||{}, n = (newer.state.records||{})[dk]||{};
    const allT = new Set([...Object.keys(o), ...Object.keys(n)]);
    const day = {};
    for(const tid of allT){
      const inN = n[tid] && n[tid].done;
      const inO = o[tid] && o[tid].done;
      if(inN) day[tid] = n[tid];              // 较新侧已打卡 → 保留（含其金额）
      else if(inO && !(tid in n)) day[tid] = o[tid];  // 较新侧完全没这条记录（旧数据未涉及）→ 保留
      // else：较新侧存在但为未打卡 → 视为已被取消，丢弃
    }
    if(Object.keys(day).length) recs[dk] = day;
  }
  out.records = recs;
  out.expenses = Object.assign({}, older.state.expenses||{}, newer.state.expenses||{}); // 日列表较新侧覆盖
  if(!out.updatedAt) out.updatedAt = newer.u;
  return out;
}
function askMerge(remote, remoteU){
  const info = (s,u)=>({time:(u||"—"), recs:countRecs(s.records), inc:sumIncome(s)});
  const L = info(state, state.updatedAt), C = info(remote, remoteU);
  const merged = mergeStates({state:remote, u:remoteU}, {state, u:state.updatedAt||""});
  const M = info(merged, merged.updatedAt);
  const mask = document.createElement("div"); mask.className="modal-mask";
  mask.innerHTML = `<div class="modal" style="max-width:400px">
    <h3>☁️ 发现两端都有新改动</h3>
    <table style="width:100%;font-size:.78rem;border-collapse:collapse;margin-top:6px">
      <tr style="color:#888"><td></td><td>打卡数</td><td>累计收入</td><td>最后修改</td></tr>
      <tr><td><b>本机</b></td><td>${L.recs}</td><td>${money(L.inc)}</td><td>${fmtT(L.time)}</td></tr>
      <tr><td><b>云端</b></td><td>${C.recs}</td><td>${money(C.inc)}</td><td>${fmtT(C.time)}</td></tr>
      <tr style="color:var(--green)"><td><b>合并</b></td><td>${M.recs}</td><td>${money(M.inc)}</td><td>—</td></tr>
    </table>
    <p style="font-size:.7rem;color:#999;margin-top:8px">提示：合并取两边打卡记录的并集；某端"取消打卡/撤销消费"会被另一端视为最新而生效。若结果有出入，可在日/周视图手动修正。</p>
    <div class="m-actions" style="flex-wrap:wrap;justify-content:center">
      <button class="m-ok" id="mg-merge">✅ 合并两者（推荐）</button>
      <button class="m-cancel" id="mg-local">以本机为准</button>
      <button class="m-cancel" id="mg-cloud">以云端为准</button>
    </div></div>`;
  document.body.appendChild(mask);
  const done=(fn)=>{mask.remove(); fn();};
  mask.querySelector("#mg-merge").onclick=()=>done(()=>{ applyState(merged); saveStateOnly(); gistPush(state).then(()=>markSynced(state.updatedAt)).catch(()=>{}); render(); });
  mask.querySelector("#mg-local").onclick=()=>done(()=>{ gistPush(state).then(()=>markSynced(state.updatedAt)).catch(()=>{}); });
  mask.querySelector("#mg-cloud").onclick=()=>done(()=>{ applyCloud(remote); markSynced(remoteU); });
}
function countRecs(recs){ let n=0; for(const dk in recs||{}) n+=Object.keys(recs[dk]||{}).length; return n; }
function sumIncome(s){ let n=0; for(const dk in s.records||{}) for(const tid in s.records[dk]){const v=s.records[dk][tid]; if(v&&v.done)n+=v.amount||0;} return n; }

function applyState(s){

  // 任务目录跟随当前本地配置或从传入数据中继承
  const localTasks = (s && s.config && Array.isArray(s.config.tasks) && s.config.tasks.length)
    ? s.config.tasks

function rangeStats(startD, endD){ // [start,end] 闭区间，按日遍历
  let income=0, expense=0, gameHours=0, bestDay=0, maxSingle=0, doneCnt=0, possible=0;
  const total = tasks().length;
  for(let d=new Date(startD); d<=endD; d=addDays(d,1)){
    const dk=dkey(d);
    const inc=dayIncome(dk); income+=inc; if(inc>maxSingle) maxSingle=inc;
    expense+=dayExpense(dk); gameHours+=dayGameHours(dk);
    const rec=state.records[dk]||{};
    for(const t of tasks()){
      if(t.weekendOnly && !isWeekend(d)) continue;
      possible++; if(rec[t.id]&&rec[t.id].done) doneCnt++;
    }
  }
  income=Math.round(income*100)/100; expense=Math.round(expense*100)/100;
  bestDay=0;
  return {income, expense, gameHours, maxSingle, doneCnt, possible};
}
// 总结余 = 全部已记录收入 - 全部已记录支出（不按日期截断，避免未来打卡不计入）
function allIncome(){ let s=0; for(const dk in state.records) s+=dayIncome(dk); return Math.round(s*100)/100; }
function allExpense(){ let s=0; for(const dk in state.expenses) s+=dayExpense(dk); return Math.round(s*100)/100; }
function totalBalance(){ return Math.round((allIncome()-allExpense())*100)/100; }
function totalGameHours(){
  let h=0; for(const dk in state.expenses) h+=dayGameHours(dk);
  return Math.round(h*100)/100;
}
function money(x){
  const r=Math.round(x*100)/100;
  return "¥"+(Number.isInteger(r)?r:r.toFixed(r*10%10?2:1));
}

/* ================= 渲染入口 ================= */
const $ = s=>document.querySelector(s);
const main = $("#main");

function pickDefaultView(){ return window.innerWidth>=1024 ? "week" : "day"; }
function setView(v){ view=v; render(); }

function render(){
  if(!view) view = pickDefaultView();
  document.querySelectorAll("#viewTabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===view));
  $("#childName").textContent = state.childName;
  $("#ftRate").textContent = state.config.gameRate;

  $("#hdIncSum").textContent = "累计收入 " + money(allIncome());
  $("#hdExpSum").textContent = "已消费 " + money(allExpense());
  const gh = totalGameHours();
  $("#hdGame").textContent = gh>0 ? "🎮 已兑 "+gh+"h" : "";
  $("#navLabel").textContent = navLabel();
  if(view==="day") renderDay();
  else if(view==="week") renderWeek();
  else if(view==="month") renderMonth();
  else renderYear();
}
function navLabel(){
  if(view==="day") return cursor.getFullYear()+"年"+(cursor.getMonth()+1)+"月"+cursor.getDate()+"日 "+WEEK_CN[cursor.getDay()];
  if(view==="week"){const ws=weekStart(cursor),we=addDays(ws,6);
    return (ws.getMonth()===we.getMonth()? ws.getFullYear()+"年"+(ws.getMonth()+1)+"月": ws.getFullYear()+"/"+(ws.getMonth()+1)+"/"+ws.getDate())+" 第"+weekNo(cursor)+"周";}
  if(view==="month") return cursor.getFullYear()+"年"+(cursor.getMonth()+1)+"月";
  return cursor.getFullYear()+"年";
}
function weekNo(d){
  const y=d.getFullYear(), jan1=new Date(y,0,1);
  return Math.floor(((d-jan1)/86400000 + jan1.getDay())/7)+1;
}

/* ---------- 日视图 ---------- */
function renderDay(){

  const we = isWeekend(cursor);
  const rec = state.records[dk]||{};
  let html="";
  let doneCnt=0, total=0;
  for(const t of tasks()){ if(t.weekendOnly&&!we) continue; total++; if(rec[t.id]&&rec[t.id].done) doneCnt++; }
  const pct = total? doneCnt/total : 0;
  const inc = dayIncome(dk), exp = dayExpense(dk);

  html += `<div class="day-head">
    <div class="progress-ring">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="none" stroke="#eee" stroke-width="6"/>
        <circle cx="28" cy="28" r="24" fill="none" stroke="${pct>=1?'#1e8449':'#F5A623'}" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${(2*Math.PI*24).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*24*(1-pct)).toFixed(1)}"/>
      </svg>
      <div class="pr-txt">${doneCnt}/${total}</div>

    <div class="day-income">当日收入<b>${money(inc)}</b>${exp?`<span style="color:var(--accent);font-size:.75rem">支出 ${money(exp)}</span>`:""}</div>
  </div>`;

  if(we){
    const avail = totalBalance();
    html += `<div class="spend-card">
      <h3>🎁 周末消费 <span class="bal-hint">可用结余 ${money(avail)}</span></h3>
      <div class="spend-actions">
        <button class="btn-add-exp" id="btnAddExp">➕ 添加消费项（如：零花钱转到支付宝）</button>
      </div>
      ${renderDayExpenses(dk)}
    </div>`;
  }else{
    html += `<div class="midweek-note">📅 自定义消费记录仅限<strong>周六、周日</strong>添加；用零花钱兑换电脑时长请到「🖥️ 电脑任务」。</div>`;
  }

  const groups = {};
  for(const t of tasks()){ (groups[t.group]=groups[t.group]||[]).push(t); }
  for(const g in groups){
    let gDone=0,gSum=0,gTotal=0;
    let rows = groups[g].map(t=>{
      const off = t.weekendOnly && !we;
      const on = !off && rec[t.id] && rec[t.id].done;
      if(!off){gTotal++; if(on){gDone++; gSum+=rec[t.id].amount||0;}}
      return `<div class="task ${on?'done':''} ${off?'off':''}" data-task="${t.id}">
        <span class="ck">${on?'✓':''}</span><span class="nm">${t.name}${t.weekendOnly?' <span style="font-size:.65rem;color:var(--red)">仅周末</span>':''}</span>
        <span class="amt">${off?'—':(on?'+'+money(rec[t.id].amount).slice(1)+'元':t.amountText)}</span></div>`;
    }).join("");
    html += `<div class="grp ${GROUP_CLASS[g]}"><div class="grp-title">${g}<span class="gt-sum">${gDone}/${gTotal} · ${money(gSum)}</span></div>
      <div class="task-list">${rows}</div></div>`;

  main.innerHTML = html;

}
function renderDayExpenses(dk){
  const list = state.expenses[dk];
  if(!Array.isArray(list)||!list.length) return "";
  return `<div class="day-expenses">${list.map((e,i)=>`<div class="exp-item">
    <span class="ex-nm">${e.type==="game"?"🎮 游戏时间 "+e.hours+" 小时":"🛒 "+escapeHtml(e.name||"消费")}</span>
    <span class="ex-amt">-${money(e.amount)}</span>
    <button class="ex-del" data-expidx="${i}" title="撤销">✕</button></div>`).join("")}</div>`;

function bindDay(){
  main.querySelectorAll(".task:not(.off)").forEach(el=>{
    el.addEventListener("click", ()=>{ toggleTask(el.dataset.task, dkey(cursor)); });
  });
  const ba=$("#btnAddExp"); if(ba) ba.addEventListener("click",()=>openCustomExpense(dkey(cursor)));
  main.querySelectorAll(".ex-del").forEach(b=>b.addEventListener("click",()=>{delExpense(dkey(cursor),+b.dataset.expidx);}));
}
function clampHours(v){v=Math.floor(v*2)/2; return Math.max(0.5, Math.min(v, 24));}

function toggleTask(tid, dk){
  state.records[dk] = state.records[dk]||{};
  const t = tasks().find(x=>x.id===tid); if(!t) return;
  if(t.weekendOnly && !isWeekend(parseKey(dk))){ toast("该任务仅周末可打卡"); return; }
  const cur = state.records[dk][tid];
  if(cur && cur.done){ delete state.records[dk][tid]; if(!Object.keys(state.records[dk]).length) delete state.records[dk]; }
  else if(t.weekendOnly){ openWeekendAmount(t, dk); return; }  // 周末家务：自由设定所得金额
  else state.records[dk][tid] = {done:true, amount:t.amount};
  saveState(); render();
}
function openWeekendAmount(t, dk){
  showModal({
    title:`✅ ${t.name}`,
    fields:[{id:"wamt", label:`本次获得金额（元）· 参考 ${t.amountText}`, type:"number", step:"0.5", min:"0.5", placeholder:"输入金额", value:String(t.amount), chips:[1,2,3]}],
    hint:"点击金额快捷键或直接输入，确认后即可打卡",
    onOk:(vals,err)=>{
      const amt=Math.round((+vals.wamt||0)*100)/100;
      if(!(amt>0)){err("请输入大于 0 的金额");return;}
      if(amt>20){err("金额看起来过大，请确认");return;}
      state.records[dk]=state.records[dk]||{};
      state.records[dk][t.id]={done:true, amount:amt};
      saveState(); toast(`${t.name.split("：")[0]} ✓ 入账 ${money(amt)}`); render();
    }
  });
}

/* ================= 周末消费（游戏时长兑换已下线：电脑时长在「电脑任务」用零花钱兑换） ================= */
function openCustomExpense(dk){
  const avail = totalBalance();
  showModal({
    title:"➕ 添加消费项（仅周末）",
    fields:[
      {id:"cname", label:"消费事项", type:"text", placeholder:"如：买文具 / 冰淇淋 / 玩具", value:""},
      {id:"camt",  label:"金额（元）", type:"number", step:"0.5", min:"0.5", placeholder:"如：3", value:""}
    ],
    hint:"可用结余 "+money(avail),
    onOk:(vals,err)=>{
      const name=(vals.cname||"").trim(); const amt=Math.round((+vals.camt||0)*100)/100;
      if(!name){err("请填写事项名称");return;}
      if(!(amt>0)){err("金额需大于 0");return;}
      if(amt>totalBalance()){err("结余不足，还差 "+money(amt-totalBalance()));return;}
      state.expenses[dk]=state.expenses[dk]||[];
      state.expenses[dk].push({type:"custom", name, amount:amt});
      saveState(); toast("已记录消费「"+name+"」-"+money(amt)); render();
    }
  });
}
function delExpense(dk, idx){
  const e = (state.expenses[dk]||[])[idx]; if(!e) return;
  if(!confirm("撤销这笔"+(e.type==="game"?` ${e.hours} 小时游戏兑换`:`「${e.name}」消费`)+"？结余将回退 "+money(e.amount))) return;
  state.expenses[dk].splice(idx,1);
  if(!state.expenses[dk].length) delete state.expenses[dk];
  saveState(); render();
}

/* ==== 电脑任务（合并原「电脑时长」与「任务分派」） ====*/

/* ================= 任务分派（奖励电脑时长，不产生零花钱） =================
   数据存 state.config.dispatch = {tasks:[{id,name,minutes,createdAt}]}；
   完成打卡复用 records（不写 amount → 收入统计不受影响，即「不计算奖金」）。
   孩子电脑 PCGuardian 锁定页显示任务清单；已完成且未使用的奖励出现在
   「🎁 可用的奖励时间」，孩子可多选累计使用；点击「开始使用」即从
   孩子电脑的本地台账扣除（孩子端只读 Gist，已用状态存孩子本机，防篡改）。 */
function dispatchTasks(){ return state.config.dispatch.tasks; }
function dispatchEarned(tid){
  // 与孩子端同口径：取全部记录中最新一天的 done 值（撤销打卡即收回未使用的奖励）
  let res=false;
  for(const dk of Object.keys(state.records||{}).sort()){
    const e=(state.records[dk]||{})[tid];
    if(e) res=!!e.done;
  }
  return res;
}
function dispatchSetDone(tid, done){
  const dk=dkey(new Date());
  if(done){
    state.records[dk] = state.records[dk]||{};
    state.records[dk][tid] = {done:true};          // 无 amount → 不计奖金
  }else{
    for(const k in state.records){
      delete state.records[k][tid];
      if(!Object.keys(state.records[k]).length) delete state.records[k];
    }
  }
  saveState();
}

  const _GEN_GRADES=["一年级","二年级","三年级","四年级","五年级","六年级","七年级","八年级","九年级"];
  const _GEN_POEMS={
    1:"《咏鹅》骆宾王、《静夜思》李白、《悯农（其二）》李绅、《春晓》孟浩然、《村居》高鼎",
    2:"《登鹳雀楼》王之涣、《望庐山瀑布》李白、《夜宿山寺》李白、《敕勒歌》北朝民歌、《梅花》王安石",
    3:"《山行》杜牧、《赠刘景文》苏轼、《夜书所见》叶绍翁、《望天门山》李白、《饮湖上初晴后雨》苏轼、《望洞庭》刘禹锡、《咏柳》贺知章、《春日》朱熹、《乞巧》林杰、《嫦娥》李商隐",
    4:"《题西林壁》苏轼、《暮江吟》白居易、《出塞》王昌龄、《凉州词》王翰、《夏日绝句》李清照、《别董大》高适",
    5:"《蝉》虞世南、《示儿》陆游、《题临安邸》林升、《己亥杂诗》龚自珍、《山居秋暝》王维、《枫桥夜泊》张继",
    6:"《宿建德江》孟浩然、《六月二十七日望湖楼醉书》苏轼、《西江月·夜行黄沙道中》辛弃疾、《过故人庄》孟浩然、《春夜喜雨》杜甫、《回乡偶书》贺知章",
  };
  let _aiCfgCache=null;
  const getAiCfg=async()=>{
    if(_aiCfgCache) return _aiCfgCache;
    const url=(state.config.ai||{}).cfgUrl;
    if(!url) throw new Error("请先在「🤖 AI设置」完成配置并保存");
    const r=await fetch(url+"?t="+Date.now());
    if(!r.ok) throw new Error("读取 AI 配置失败（AI Gist 不可达）");
    _aiCfgCache=await r.json();
    return _aiCfgCache;
  };
  const genPrompt=(kind,poem,grade,words,paras,count)=>{
    const g=_GEN_GRADES[grade-1]||_GEN_GRADES[2];
    if(kind==="words") return {sys:"你是小学英语老师，只输出单词列表，每行一个，不要编号、音标或中文解释。",
      user:"请列出中国九年义务教育"+g+"学生需要掌握的英语单词，共"+count+"个。"};
    if(poem) return {sys:"你是小学语文老师。你只输出用于朗读的古诗词材料，绝不输出解释、点评或生成说明。",
      user:"请从中国小学"+g+"语文教材中选取"+count+"首真实存在的经典古诗词（必须是教材里的名篇，例如："+(_GEN_POEMS[grade]||_GEN_POEMS[3])+
           "。严禁虚构、改编或拼凑任何诗句；每首诗你必须百分之百确定原文无误），生成一份朗读材料。每首格式：《诗名》朝代·作者，另起一行输出诗文原文（保留标点，与教材原文完全一致），每首之间空一行。所有诗加起来正文不少于"+words+"字。"};
    return {sys:"你是小学语文老师，为学生的朗读练习生成材料。只输出正文，不要标题、序号或解释。",
      user:"请生成一篇适合"+g+"小学生朗读的中文短文：全文约"+words+"字，分成"+paras+"个自然段（段与段之间空一行）。内容积极向上、贴近孩子生活，句子简短、标点完整。"};
  };
  const parseWordList=(s)=>{
    const BS=String.fromCharCode(92);
    const reLine=new RegExp("^["+BS+"d]+[.、)"+BS+"s]*");
    return (s||"").split(/[\r\n]+/).map(l=>l.replace(reLine,"").replace(/\*|_/g,"").trim())
      .filter(l=>/^[A-Za-z][A-Za-z'\-]{0,30}$/.test(l)).slice(0,30);
  };
  const aiGenerate=async(kind)=>{
    const msg=mask.querySelector("#dpGenMsg");
    msg.textContent="生成中…（约几秒到十几秒）";
    try{
      const poem=(mask.querySelector("#dpPoem")||{checked:false}).checked;
      const grade=+(mask.querySelector("#dpGenGrade").value||3);
      const wordsN=+((mask.querySelector("#dpGenWords")||{value:200}).value||200);
      const paras=+((mask.querySelector("#dpGenParas")||{value:2}).value||2);
      const count=+((mask.querySelector("#dpGenCount")||{value:kind==="read"?3:10}).value||10);
      let text="", words=null;
      if(window.__lanSync){
        const body=kind==="words"
          ? {type:"words", grade, count}
          : poem
          ? {type:"poem", grade, count, words:wordsN}
          : {type:"read", grade, words:wordsN, paras};
        const r=await fetch("/api/ai/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        const j=await r.json();
        if(j.error) throw new Error(j.error);
        text=j.text||""; words=j.words||null;
      }else{
        const cfg=await getAiCfg();
        const p=genPrompt(kind,poem,grade,wordsN,paras,count);
        const r=await fetch(cfg.endpoint.replace(/\/$/,"")+"/chat/completions",{method:"POST",
          headers:{Authorization:"Bearer "+cfg.apiKey,"Content-Type":"application/json"},
          body:JSON.stringify({model:cfg.chatModel,messages:[{role:"system",content:p.sys},{role:"user",content:p.user}],temperature:0.8})});
        const raw=await r.text();
        let j; try{ j=JSON.parse(raw); }catch(e){ throw new Error("接口返回异常："+raw.slice(0,60)); }
        if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
        const content=((j.choices||[])[0]||{}).message?.content||"";
        if(kind==="words") words=parseWordList(content);
        else text=content.trim();
      }
      if(kind==="words"){
        if(!words||!words.length) throw new Error("未得到有效单词列表，请重试");
        mask.querySelector("#dpContent").value=words.join("\n");
      }else{
        if(!text) throw new Error("生成内容为空，请重试");
        mask.querySelector("#dpContent").value=text;
      }
      msg.textContent="✅ 已生成，可直接修改后发布";
    }catch(e){
      let m=e.message||String(e);
      if(m.indexOf("Failed to fetch")>=0||m.indexOf("NetworkError")>=0)
        m="无法直连大模型（浏览器跨域限制）。可改用局域网联调环境生成，或换支持浏览器直连的服务商";
      msg.textContent="❌ 生成失败："+m;
    }
  };

  mask.querySelectorAll(".dp-kind").forEach(ch=>ch.addEventListener("click",()=>{
    mask.querySelectorAll(".dp-kind").forEach(c=>c.classList.toggle("on", c===ch));
    dpKind=ch.dataset.k; renderExtra();
  }));
  renderExtra();

  mask.querySelectorAll(".dp-min").forEach(ch=>ch.addEventListener("click",()=>{
    mask.querySelectorAll(".dp-min").forEach(c=>c.classList.toggle("on", c===ch));
    mask.querySelector("#dpMin").value=ch.dataset.m;
  }));
  mask.querySelector("#dpAdd").addEventListener("click",()=>{
    const name=(mask.querySelector("#dpName").value||"").trim();
    const m=Math.round(+mask.querySelector("#dpMin").value||0);
    const err=mask.querySelector("#dpErr");
    if(!name){ err.textContent="请填写任务名称"; return; }
    if(!(m>0)){ err.textContent="奖励时长需大于 0 分钟"; return; }
    if(m>240){ err.textContent="单任务奖励最长 240 分钟"; return; }
    err.textContent="";
    let taskName=name;
    if(dpKind && !taskName){
      const c0=(mask.querySelector("#dpContent").value||"").trim();
      const first=(c0.split(/\r?\n/).find(l=>l.trim())||"").trim();
      taskName=first.slice(0,20);   // 未填名称 → 取内容第一行
      if(!taskName){ err.textContent="请填写任务名称或先生成/粘贴内容"; return; }
    }
    const task={id:"dp"+Date.now().toString(36), name:taskName, minutes:m, createdAt:new Date().toISOString()};
    if(dpKind){
      const content=(mask.querySelector("#dpContent").value||"").trim();
      const thr=Math.min(95,Math.max(60,Math.round(+mask.querySelector("#dpThr").value||80)));
      if(dpKind==="read"){
        if(content.replace(/\s/g,"").length<20){ err.textContent="朗读材料太短（至少 20 字）"; return; }
        task.kind="read"; task.content=content; task.threshold=thr;
        task.quiz=!!mask.querySelector("#dpQuiz").checked;
        task.poem=!!mask.querySelector("#dpPoem").checked;
      }else{
        const ws=content.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
        if(ws.length<3){ err.textContent="至少输入 3 个单词（每行一个）"; return; }
        if(ws.length>30){ err.textContent="一次最多 30 个单词"; return; }
        task.kind="words"; task.content=ws; task.threshold=thr;
      }
    }
    dispatchTasks().push(task);
    saveState();
    mask.querySelector("#dpName").value="";
    toast(task.kind?("📤 已发布 AI 评分任务「"+name+"」（≥"+(task.threshold||80)+"分得 "+m+" 分钟，不计奖金）")
                :("📤 已发布「"+name+"」（奖励 "+m+" 分钟电脑时间，不计奖金）"));
    renderList();
  });
  mask.querySelector("#dpName").addEventListener("keydown",e=>{ if(e.key==="Enter") mask.querySelector("#dpAdd").click(); });
}

/* ================= AI 设置（对话模型走云端 OpenAI 兼容；key 存独立 AI Gist） =================
   语音识别已内置孩子电脑本地引擎（阿里 Paraformer 中文 + Whisper 英文，按任务语言自动选择，离线可用）。
   孩子电脑只拿到 AI Gist 的 raw 地址（保存在主数据 config.ai.cfgUrl），
   接口密钥本身仅存于独立 Gist，孩子端直连 AI 服务商进行出题/判题。 */
async function saveAiCfgToGist(cfg){
  const c=syncCfg();
  if(!(c.gistId && c.token)) throw new Error("本机云同步未启用：请先点顶栏 ☁️ 完成配置");
  const files={["ai-config.json"]:{content: JSON.stringify(cfg, null, 2)}};
  let gistId=state.config.ai.cfgGistId||null, owner=null;
  const H={Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"};
  if(gistId){
    const r=await fetch(`${c.apiBase}/gists/${gistId}`,{method:"PATCH",headers:H,body:JSON.stringify({files})});
    if(!r.ok) throw new Error("更新 AI Gist 失败 HTTP "+r.status);
  }else{
    const r=await fetch(`${c.apiBase}/gists`,{method:"POST",headers:H,
      body:JSON.stringify({description:"PCGuardian AI 接入配置（勿手动编辑）", public:false, files})});
    if(!r.ok) throw new Error("创建 AI Gist 失败 HTTP "+r.status+"（token 可能缺少创建 Gist 权限）");
    const j=await r.json(); gistId=j.id; owner=(j.owner||{}).login;
  }
  if(!owner){
    const r=await fetch(`${c.apiBase}/gists/${gistId}`,{headers:H});
    owner=((await r.json()).owner||{}).login;
  }
  state.config.ai={cfgGistId:gistId,
    cfgUrl:`https://gist.githubusercontent.com/${owner}/${gistId}/raw/ai-config.json`};
  saveState();
}

/* ---- 批量导入任务：一个 .md/.txt = 一个任务（首行=标题，其余=内容，自动分段/判定单词或文章） ---- */
// 常驻隐藏 input（抽屉是动态创建的，不能依赖加载时存在的元素）
const _importTasksInput = document.createElement("input");
_importTasksInput.type = "file";
_importTasksInput.accept = ".md,.txt,text/markdown,text/plain";
_importTasksInput.multiple = true;
_importTasksInput.style.display = "none";
document.body.appendChild(_importTasksInput);
// 事件委托：按钮在「电脑任务」抽屉里动态出现，用委托绑定避免加载时报 null
document.addEventListener("click", e=>{
  const b = e.target && e.target.closest && e.target.closest("#btnImportTasks");
  if (b) { e.preventDefault(); _importTasksInput.click(); }
});
_importTasksInput.addEventListener("change",e=>{
  const files=[...e.target.files||[]]; if(!files.length) return;
  let ok=0, fail=[], done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const text=String(r.result||"").replace(/\r\n/g,"\n").trim();
        if(!text) throw new Error("空文件");
        const lines=text.split("\n");
        const firstIdx=lines.findIndex(l=>l.trim());
        const title=(lines[firstIdx]||"").replace(/^#\s*/,"").trim().slice(0,30) || f.name.replace(/\.(md|txt)$/i,"");
        const contentLines=lines.slice(firstIdx+1).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim()!=="");
        if(!contentLines.length) throw new Error("只有标题没有内容");
        const wordLines=contentLines.map(l=>l.trim()).filter(Boolean);
        const isWords = wordLines.length>=3
          && wordLines.every(l=>/^[A-Za-z][A-Za-z\u00C0-\u024F\u2019\'-]{0,25}$/.test(l))
          && wordLines.length<=60;
        const task={id:"dp"+Date.now().toString(36)+Math.floor(Math.random()*1e4),
                    name:title,
                    minutes:isWords?(Math.max(5,Math.min(15,wordLines.length))):20,
                    createdAt:new Date().toISOString()};
        if(isWords){
          task.kind="words"; task.content=wordLines; task.threshold=80;
        }else{
          task.kind="read";
          task.content=contentLines.map(l=>l.replace(/^#{1,6}\s+/,"").replace(/^-{3,}$/,"").trim()).filter(l=>l!=="").join("\n\n");
          task.threshold=80;
        }
        dispatchTasks().push(task);
        ok++;
      }catch(err){ fail.push(f.name+"："+err.message); }
      done++;
      if(done===files.length){
        if(ok) saveState();
        toast(ok?("📚 已导入 "+ok+" 个任务"+(fail.length?("，失败 "+fail.length):"")):"导入失败");
        if(fail.length) alert("以下文件导入失败：\n"+fail.join("\n"));
      }
    };
    r.onerror=()=>{ fail.push(f.name+"：读取失败"); done++; };
    r.readAsText(f,"utf-8");
  });
  e.target.value="";
});

  fileHandle=null; await idbDel("handle"); $("#fileBadge").style.display="none"; toast("已解除文件绑定（数据仍在本机 localStorage）");
});
async function writeBoundFile(){
  if(!fileHandle||!view) return;
  try{
    if(await fileHandle.queryPermission({mode:"readwrite"})!=="granted"
       && await fileHandle.requestPermission({mode:"readwrite"})!=="granted"){ fileHandle=null; return; }
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(state,null,2)); await w.close();
  }catch(e){ console.warn("写绑定文件失败",e); }
}
function showFileBadge(name){ $("#fileBadge").style.display=""; $("#fileName").textContent=name; }

/* ---- IndexedDB：持久化文件 handle ---- */
function idb(){ return IDB.db ? Promise.resolve(IDB.db) : new Promise((res,rej)=>{
  const r=indexedDB.open("chore-app",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{IDB.db=r.result;res(r.result)}; r.onerror=()=>rej(r.error); });}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbDel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const rq=db.transaction("kv").objectStore("kv").get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
(async function restoreHandle(){
  if(!FS_OK) return;
  try{
    const h=await idbGet("handle");
    if(h && await h.queryPermission({mode:"readwrite"})==="granted"){ fileHandle=h; showFileBadge(h.name); }
  }catch(e){}
})();

/* ================= 弹窗与提示 ================= */
function showModal({title, fields, hint, onOk}){
  const mask=document.createElement("div"); mask.className="modal-mask";
  mask.innerHTML=`<div class="modal"><h3>${title}</h3>
    ${fields.map(f=>`<label for="mf_${f.id}">${f.label}</label><input id="mf_${f.id}" type="${f.type}" ${f.step?`step="${f.step}"`:""} ${f.min?`min="${f.min}"`:""} placeholder="${f.placeholder||""}" value="${f.value??""}">
    ${f.chips?`<div class="chip-row">${f.chips.map(c=>`<button type="button" class="chip" data-chip-for="mf_${f.id}" data-val="${c}">¥${c}</button>`).join("")}</div>`:""}`).join("")}
    ${hint?`<p style="font-size:.72rem;color:#999;margin-top:8px">${hint}</p>`:""}
    <p class="m-err" id="mErr"></p>
    <div class="m-actions"><button class="m-cancel">取消</button><button class="m-ok">确定</button></div></div>`;
  document.body.appendChild(mask);
  const close=()=>mask.remove();
  const born=Date.now();          // 出生保护：移动端点按钮的第二次合成点击会落在遮罩上，500ms 内忽略
  mask.addEventListener("click",e=>{ if(e.target===mask && Date.now()-born>500) close(); });
  mask.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    const inp=mask.querySelector("#"+ch.dataset.chipFor); if(inp) inp.value=ch.dataset.val;
    mask.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c===ch));
  }));
  mask.querySelector(".m-cancel").onclick=close;
  mask.querySelector(".m-ok").onclick=()=>{
    const vals={}; fields.forEach(f=>vals[f.id]=mask.querySelector("#mf_"+f.id).value);
    onOk(vals, msg=>{mask.querySelector("#mErr").textContent=msg});
    if(!mask.querySelector("#mErr").textContent) close();
  };
  const fi=mask.querySelector("input"); if(fi){fi.focus(); fi.addEventListener("keydown",e=>{if(e.key==="Enter")mask.querySelector(".m-ok").click()});}
}
let toastTimer=null;
function toast(msg){
  let t=$(".toast"); if(t)t.remove();
  t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),350)},2200);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ================= 启动 ================= */
/* 配置链接引导：URL 片段携带 token（# 后的内容不会发送到服务器/不会进入 git），
   设备首次打开配置链接即自动保存到本机，之后正常打开网页无需任何操作。 */
(function hashBootstrap(){
  const h = decodeURIComponent(location.hash||"");
  const m = h.match(/token=([A-Za-z0-9_\-\.]+)/);
  if(m && /^(github_pat_|gh[pousr])/.test(m[1])){
    saveSyncCfg({token:m[1], disabled:false});
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    setTimeout(()=>toast("☁️ 云同步配置成功，本机已自动开启"), 300);
  }
})();
/* ================= 任务管理抽屉 ================= */
(function initTaskManagerDrawer(){
  const drawerHtml = `
  <div class="td-mask" id="tdMask">
    <div class="td-drawer">
      <div class="td-header">
        <h2>⚙️ 任务管理</h2>
        <button class="td-btn-add" id="tdBtnAdd">➕ 新增任务</button>
        <button class="td-btn-reset" id="tdBtnReset" title="恢复预设默认任务与金额">🔄 恢复默认</button>
        <button class="td-btn-close" id="tdBtnClose" title="关闭">✕</button>
      </div>
      <div class="td-body" id="tdBody"></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend", drawerHtml);

  const tdMask = document.getElementById("tdMask");
  const tdBody = document.getElementById("tdBody");
  const btnManage = document.getElementById("btnTaskManage");

  if(btnManage){
    btnManage.addEventListener("click", openTaskManager);
  }
  document.getElementById("tdBtnClose").addEventListener("click", closeTaskManager);
  const tdBorn=Date.now();
  tdMask.addEventListener("click", e=>{ if(e.target===tdMask && Date.now()-tdBorn>500) closeTaskManager(); });
  document.getElementById("tdBtnAdd").addEventListener("click", ()=>openTaskEditModal(null));
  document.getElementById("tdBtnReset").addEventListener("click", resetTasksToDefault);

  function openTaskManager(){
    renderTaskManager();
    tdMask.classList.add("show");
  }
  function closeTaskManager(){
    tdMask.classList.remove("show");
  }

  function renderTaskManager(){
    const list = tasks();
    const groups = {};
    for(const t of list){
      (groups[t.group] = groups[t.group] || []).push(t);
    }
    let html = "";
    for(const g in groups){
      const grpClass = GROUP_CLASS[g] || "";
      html += `<div class="td-grp-card ${grpClass}">
        <div class="td-grp-hd"><span>${g}</span><span style="font-size:.75rem;color:var(--ink2)">共 ${groups[g].length} 项</span></div>`;
      for(const t of groups[g]){
        html += `<div class="td-task-row">
          <div class="td-task-main">
            <div class="td-task-title">
              <span>${escapeHtml(t.name)}</span>
              ${t.weekendOnly ? `<span class="td-we-badge">仅周末</span>` : ""}
            </div>
            <div class="td-task-sub">
              <span class="td-amt-tag">¥${t.amount}</span>
              <span class="td-amt-text">显示文案: ${escapeHtml(t.amountText||"")}</span>
            </div>
          </div>
          <div class="td-task-ops">
            <button class="btn-edit" data-edit-id="${t.id}" title="编辑名称与金额">✏️ 编辑</button>
            <button class="btn-del" data-del-id="${t.id}" title="删除任务">🗑️ 删除</button>
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    if(!list.length){
      html = `<div style="text-align:center;padding:40px 10px;color:#999;font-size:.85rem">暂无任务，请点击上方「➕ 新增任务」或「🔄 恢复默认」</div>`;
    }
    tdBody.innerHTML = html;

    tdBody.querySelectorAll("button[data-edit-id]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const tid = btn.getAttribute("data-edit-id");
        const t = tasks().find(x=>x.id===tid);
        if(t) openTaskEditModal(t);
      });
    });
    tdBody.querySelectorAll("button[data-del-id]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const tid = btn.getAttribute("data-del-id");
        deleteTask(tid);
      });
    });
  }

  function openTaskEditModal(t){
    const isNew = !t;
    const defGroup = t ? t.group : "🏠 家务";
    const curName = t ? t.name : "";
    const curAmount = t ? t.amount : 1;
    const curText = t ? t.amountText : "+1元";
    const curWe = t ? !!t.weekendOnly : false;

    const modal = document.createElement("div");
    modal.className = "td-form-modal";
    modal.innerHTML = `
      <div class="td-form-card">
        <h3>${isNew ? "➕ 新增任务" : "✏️ 编辑任务与金额"}</h3>
        <div class="td-form-field">
          <label>所属分组</label>
          <div class="td-chips" id="fmGrpChips">
            ${["🌅 晨间","🏠 家务","📚 学习","🏃 运动"].map(g=>`<button type="button" class="td-chip ${g===defGroup?'on':''}" data-val="${g}">${g}</button>`).join("")}
          </div>
          <input type="text" id="fmGroup" value="${escapeHtml(defGroup)}" placeholder="自定义或点击上方预设分组" style="margin-top:6px">
        </div>
        <div class="td-form-field">
          <label>任务名称</label>
          <input type="text" id="fmName" value="${escapeHtml(curName)}" placeholder="例如：整理书架 / 跳绳100下">
        </div>
        <div class="td-form-field">
          <label>奖励金额（元）</label>
          <input type="number" id="fmAmount" step="0.5" min="0.1" value="${curAmount}" placeholder="例如：1.5">
          <div class="td-chips" id="fmAmtChips">
            ${[0.5, 1, 1.5, 2, 3, 5].map(v=>`<button type="button" class="td-chip ${Number(v)===Number(curAmount)?'on':''}" data-val="${v}">¥${v}</button>`).join("")}
          </div>
        </div>
        <div class="td-form-field">
          <label>显示文案（卡片及表格展示）</label>
          <input type="text" id="fmAmountText" value="${escapeHtml(curText)}" placeholder="例如：+1.5元 或 +1~3元">
        </div>
        <div class="td-checkbox-row">
          <input type="checkbox" id="fmWeekend" ${curWe ? "checked" : ""}>
          <label for="fmWeekend" style="cursor:pointer">仅限周六、周日显示与打卡</label>
        </div>
        <div class="td-form-err" id="fmErr"></div>
        <div class="td-form-actions">
          <button class="m-cancel" id="fmCancel">取消</button>
          <button class="m-ok" id="fmSave">保存</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    const grpInput = modal.querySelector("#fmGroup");
    modal.querySelectorAll("#fmGrpChips .td-chip").forEach(ch=>{
      ch.addEventListener("click", ()=>{
        grpInput.value = ch.getAttribute("data-val");
        modal.querySelectorAll("#fmGrpChips .td-chip").forEach(c=>c.classList.toggle("on", c===ch));
      });
    });

    const amtInput = modal.querySelector("#fmAmount");
    const textInput = modal.querySelector("#fmAmountText");
    let textModifiedManually = !isNew && curText !== `+${curAmount}元`;

    textInput.addEventListener("input", ()=>{
      textModifiedManually = true;
    });

    amtInput.addEventListener("input", ()=>{
      const val = parseFloat(amtInput.value);
      if(!textModifiedManually && !isNaN(val) && val > 0){
        textInput.value = `+${val}元`;
      }
      modal.querySelectorAll("#fmAmtChips .td-chip").forEach(c=>{
        c.classList.toggle("on", parseFloat(c.getAttribute("data-val")) === val);
      });
    });

    modal.querySelectorAll("#fmAmtChips .td-chip").forEach(ch=>{
      ch.addEventListener("click", ()=>{
        const v = ch.getAttribute("data-val");
        amtInput.value = v;
        if(!textModifiedManually){
          textInput.value = `+${v}元`;
        }
        modal.querySelectorAll("#fmAmtChips .td-chip").forEach(c=>c.classList.toggle("on", c===ch));
      });
    });

    const closeModal = ()=>modal.remove();
    modal.addEventListener("click", e=>{ if(e.target===modal) closeModal(); });
    modal.querySelector("#fmCancel").onclick = closeModal;

    modal.querySelector("#fmSave").onclick = ()=>{
      const groupVal = (grpInput.value || "").trim() || "🏠 家务";
      const nameVal = (modal.querySelector("#fmName").value || "").trim();
      const amtVal = parseFloat(amtInput.value);
      const textVal = (textInput.value || "").trim() || (amtVal>0 ? `+${amtVal}元` : "");
      const weVal = modal.querySelector("#fmWeekend").checked;
      const errEl = modal.querySelector("#fmErr");

      if(!nameVal){
        errEl.textContent = "请填写任务名称";
        return;
      }
      if(isNaN(amtVal) || amtVal <= 0){
        errEl.textContent = "请输入大于 0 的奖励金额";
        return;
      }

      if(isNew){
        const newId = "t_" + Date.now();
        state.config.tasks.push({
          id: newId,
          group: groupVal,
          name: nameVal,
          amount: Math.round(amtVal * 100) / 100,
          amountText: textVal,
          weekendOnly: weVal
        });
        toast(`已新增任务「${nameVal}」`);
      } else {
        t.group = groupVal;
        t.name = nameVal;
        t.amount = Math.round(amtVal * 100) / 100;
        t.amountText = textVal;
        t.weekendOnly = weVal;
        toast(`已更新任务「${nameVal}」`);
      }

      saveState();
      renderTaskManager();
      render();
      closeModal();
    };
  }

  function deleteTask(tid){
    const t = tasks().find(x=>x.id===tid);
    if(!t) return;
    if(!confirm(`确定要删除任务「${t.name}」吗？\n（历史已完成的打卡记录和累计金额将完整保留）`)){
      return;
    }
    state.config.tasks = state.config.tasks.filter(x=>x.id!==tid);
    saveState();
    renderTaskManager();
    render();
    toast(`已删除「${t.name}」`);
  }

  function resetTasksToDefault(){
    if(!confirm("确定要将任务列表恢复为系统预设的 24 项任务与金额吗？\n当前的自定义任务修改将被重置。")){
      return;
    }
    state.config.tasks = DEFAULT_TASKS.map(t=>({...t}));
    saveState();
    renderTaskManager();
    render();
    toast("已恢复预设任务与金额");
  }
})();
